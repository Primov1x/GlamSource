name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (API 15)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/api15/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud
          echo "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" >> $env:GITHUB_ENV

      - name: Restore
        # ponytail: --force-evaluate ignores stale lockfile hashes — local NuGet.Config
        # points at a dev feed for Glamourer.Api that CI doesn't have, so the lockfile
        # hash never matches nuget.org's copy of the same version.
        run: dotnet restore GlamSource.csproj --force-evaluate

      - name: Build
        run: dotnet build GlamSource.csproj -c Release --no-restore

      - name: Test
        run: dotnet test GlamSource.Core.Tests/GlamSource.Core.Tests.csproj -c Release --no-build

      - name: Create plugin package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts
          # ponytail: DalamudPackager already produces a complete plugin zip
          # (bin\**\Release\**\GlamSource\latest.zip) with regenerated manifest
          # and all runtime DLLs. Use it directly — the hand-rolled Copy-Item
          # approach picked stale bin subdirs and missed the DLLs entirely.
          $zip = Get-ChildItem -Path bin -Recurse -Filter "latest.zip" `
                   | Where-Object { $_.FullName -match 'Release' -and $_.Directory.Name -eq 'GlamSource' } `
                   | Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager output not found under bin\**\Release\**\GlamSource\latest.zip" }
          Write-Host "Using package: $($zip.FullName)"
          Copy-Item $zip.FullName -Destination ./artifacts/GlamSource.zip
          Get-ChildItem -Path ./artifacts | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlamSource
          path: './artifacts/GlamSource.zip'
          if-no-files-found: error

      - name: Publish to LATEST release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Copy-Item ./artifacts/GlamSource.zip ./artifacts/latest.zip
          gh release upload LATEST ./artifacts/GlamSource.zip ./artifacts/latest.zip --clobber --repo ${{ github.repository }}