name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (API 15)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/api15/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud
          echo "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore GlamSource.csproj

      - name: Build
        run: dotnet build GlamSource.csproj -c Release --no-restore

      - name: Test
        run: dotnet test GlamSource.Core.Tests/GlamSource.Core.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack GlamSource.csproj -c Release /p:IsPackable=true -o ./artifacts

      - name: Locate build output
        run: Get-ChildItem -Recurse -Filter "*.zip" -Path ./artifacts | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlamSource
          path: './artifacts/*.zip'
          if-no-files-found: error