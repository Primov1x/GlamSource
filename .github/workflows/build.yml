name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud DLLs
        run: |
          $repo = 'https://api.github.com/repos/goatcorp/Dalamud/releases/latest'
          $release = Invoke-RestMethod $repo -Headers @{ 'Accept' = 'application/vnd.github.v3+json' }
          $url = $release.assets | Where-Object name -like '*selfhost*' | Select-Object -First 1 -ExpandProperty browser_download_url
          $out = 'Dalamud.zip'
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive -Path $out -DestinationPath '.' -Force
          $dllPath = (Get-ChildItem -Recurse -Filter "Dalamud.dll" | Select-Object -First 1).Directory.FullName
          Write-Host "Found Dalamud.dll in: $dllPath"
          Add-Content -Path $env:GITHUB_ENV -Value "DALAMUD_HOME=$dllPath"
        shell: pwsh

      - name: Restore
        run: dotnet restore GlamSource.csproj

      - name: Build
        run: dotnet build GlamSource.csproj -c Release --no-restore

      - name: Test
        run: dotnet test GlamSource.Core.Tests/GlamSource.Core.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack GlamSource.csproj -c Release /p:IsPackable=true -o ./artifacts

      - name: Locate build output
        run: Get-ChildItem -Recurse -Filter "*.zip" -Path ./artifacts | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlamSource
          path: './artifacts/*.zip'
          if-no-files-found: error