name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (API 15)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/api15/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud
          echo "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" >> $env:GITHUB_ENV

      - name: Restore
        # ponytail: --force-evaluate ignores stale lockfile hashes — local NuGet.Config
        # points at a dev feed for Glamourer.Api that CI doesn't have, so the lockfile
        # hash never matches nuget.org's copy of the same version.
        run: dotnet restore GlamSource.csproj --force-evaluate

      - name: Build
        run: dotnet build GlamSource.csproj -c Release --no-restore

      - name: Test
        run: dotnet test GlamSource.Core.Tests/GlamSource.Core.Tests.csproj -c Release --no-build

      - name: Create plugin package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts
          # ponytail: find the DalamudPackager output by locating the regenerated
          # manifest — its directory is the packaged plugin. "First bin subdir
          # alphabetically" picked a stale intermediate (Debug / non-packager
          # Release) and shipped 0.0.0.29 even after the csproj bump.
          $manifest = Get-ChildItem -Path bin -Recurse -Filter "GlamSource.json" `
                        | Where-Object { $_.FullName -match 'Release' -and $_.Directory.Name -eq 'GlamSource' } `
                        | Select-Object -First 1
          if (-not $manifest) { throw "DalamudPackager output not found under bin\**\Release\**\GlamSource\GlamSource.json" }
          $buildDir = $manifest.Directory
          Write-Host "Packaging from: $($buildDir.FullName)"
          # pack every runtime DLL + json, not a hand-picked allow-list —
          # transitive deps (LuminaSupplemental.Excel etc.) keep changing, chasing
          # them one crash report at a time is the wrong approach.
          $files = Get-ChildItem -Path $buildDir.FullName -Filter "*.dll"
          $files += Get-ChildItem -Path $buildDir.FullName -Filter "GlamSource.json"
          Copy-Item $files.FullName -Destination ./artifacts
          Compress-Archive -Path "./artifacts/*" -DestinationPath "./artifacts/GlamSource.zip" -Force
          Get-ChildItem -Path ./artifacts | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlamSource
          path: './artifacts/GlamSource.zip'
          if-no-files-found: error